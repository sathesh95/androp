name = "clipboard-sync-relay"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[durable_objects]
bindings = [
  { name = "SYNC_ROOMS", class_name = "SyncRoom" }
]

[[r2_buckets]]
binding = "FILE_BUCKET"
bucket_name = "clipboard-sync-files"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncRoom"]
